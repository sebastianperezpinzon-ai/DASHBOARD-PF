<!DOCTYPE html>
<html lang="es" class="dark">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Consulta Detallada de Gastos | ECO-S</title>
    <!-- Tailwind CSS CDN -->
    <script src="https://cdn.tailwindcss.com"></script>
    <!-- SheetJS (Lectura de .xlsx / .csv) -->
    <script src="https://cdn.jsdelivr.net/npm/xlsx@0.18.5/dist/xlsx.full.min.js"></script>
    
    <script>
        tailwind.config = {
            darkMode: 'class',
            theme: {
                extend: {
                    colors: {
                        darkbg: '#0B0F19',
                        cardbg: '#0D1322',
                        bordercolor: '#1E293B'
                    }
                }
            }
        }
    </script>
</head>
<body class="bg-darkbg text-gray-200 font-sans min-h-screen p-4 md:p-8">

    <!-- ENCABEZADO Y NAVEGACIÓN -->
    <header class="max-w-7xl mx-auto mb-6 flex flex-col md:flex-row md:items-center justify-between gap-4 border-b border-gray-800 pb-5">
        <div>
            <div class="flex items-center gap-2 mb-1">
                <span class="text-xs bg-emerald-500/10 text-emerald-400 font-mono px-2 py-0.5 rounded border border-emerald-500/20">ECO-S Data Engine</span>
                <span id="data-status-badge" class="text-xs bg-gray-800 text-gray-400 font-mono px-2 py-0.5 rounded border border-gray-700">Cargando datos...</span>
            </div>
            <h1 class="text-2xl md:text-3xl font-bold text-white tracking-tight">Registro Detallado de Gastos</h1>
            <p class="text-xs text-gray-400 mt-1">Explora, filtra y audita los registros individuales del repositorio en tiempo real.</p>
        </div>

        <div class="flex items-center gap-3">
            <a href="index.html" class="px-4 py-2 bg-gray-800 hover:bg-gray-700 text-gray-200 text-xs font-semibold rounded-lg border border-gray-700 transition flex items-center gap-2">
                <span>← Volver al Dashboard</span>
            </a>
        </div>
    </header>

    <!-- PANEL DE CONTROL Y CONTADORES -->
    <main class="max-w-7xl mx-auto space-y-4">
        
        <div class="bg-cardbg p-4 rounded-xl border border-gray-800 shadow-xl flex flex-col md:flex-row md:items-center justify-between gap-4">
            <!-- Buscador Global -->
            <div class="relative flex-1">
                <input type="text" id="globalSearch" oninput="applyFilters()" placeholder="🔎 Buscar término en todo el archivo..." 
                    class="w-full bg-[#080C14] text-xs text-white placeholder-gray-500 px-4 py-2.5 rounded-lg border border-gray-800 focus:outline-none focus:border-emerald-500 transition">
            </div>

            <!-- Contadores y Limpiar -->
            <div class="flex items-center gap-4 justify-between md:justify-end">
                <div class="text-xs font-mono text-gray-400">
                    Mostrando: <span id="record-count" class="text-emerald-400 font-bold">0</span> / <span id="total-count" class="text-gray-200">0</span> registros
                </div>

                <button onclick="clearAllFilters()" class="px-3 py-2 bg-rose-500/10 hover:bg-rose-500/20 text-rose-400 text-xs font-medium rounded-lg border border-rose-500/20 transition">
                    🧹 Limpiar Filtros
                </button>
            </div>
        </div>

        <!-- TABLA DINÁMICA CON FILTROS EN CABECERA -->
        <div class="bg-cardbg rounded-xl border border-gray-800 shadow-xl overflow-hidden">
            <div class="overflow-x-auto max-h-[70vh]">
                <table class="w-full text-left text-xs border-collapse">
                    <thead class="bg-[#080C14] text-gray-300 font-semibold sticky top-0 z-10 border-b border-gray-800">
                        <!-- Fila 1: Títulos de las columnas -->
                        <tr id="table-headers-title" class="divide-x divide-gray-800/60">
                            <!-- Se generan dinámicamente -->
                        </tr>
                        <!-- Fila 2: Inputs de filtro por columna -->
                        <tr id="table-headers-filter" class="bg-[#05080E] divide-x divide-gray-800/60">
                            <!-- Se generan dinámicamente -->
                        </tr>
                    </thead>
                    <tbody id="table-body" class="divide-y divide-gray-800/40 font-mono text-gray-300">
                        <tr>
                            <td colspan="100%" class="p-8 text-center text-gray-500 font-sans">
                                Cargando información del archivo Excel...
                            </td>
                        </tr>
                    </tbody>
                </table>
            </div>
        </div>

    </main>

    <!-- LÓGICA JAVASCRIPT -->
    <script>
        let rawData = [];
        let filteredData = [];
        let columns = [];
        const columnFilters = {};

        document.addEventListener("DOMContentLoaded", () => {
            fetchAutoData();
        });

        // 1. CARGA AUTOMÁTICA (.xlsx con fallback a .csv)
        function fetchAutoData() {
            const excelFile = 'COMPRAS/github.xlsx';
            const badge = document.getElementById('data-status-badge');

            fetch(excelFile)
                .then(res => res.ok ? res.arrayBuffer() : Promise.reject())
                .then(buffer => {
                    const data = new Uint8Array(buffer);
                    const workbook = XLSX.read(data, { type: 'array' });
                    const firstSheet = workbook.Sheets[workbook.SheetNames[0]];
                    const json = XLSX.utils.sheet_to_json(firstSheet, { defval: "" });

                    if (json.length > 0) {
                        badge.innerText = `Cargado: ${excelFile}`;
                        badge.className = "text-xs bg-emerald-500/10 text-emerald-400 font-mono px-2 py-0.5 rounded border border-emerald-500/20";
                        processDataset(json);
                    }
                })
                .catch(() => {
                    // Fallback a CSV
                    fetch('github.csv')
                        .then(res => res.ok ? res.text() : Promise.reject())
                        .then(csvText => {
                            const workbook = XLSX.read(csvText, { type: 'string' });
                            const firstSheet = workbook.Sheets[workbook.SheetNames[0]];
                            const json = XLSX.utils.sheet_to_json(firstSheet, { defval: "" });
                            
                            badge.innerText = "Cargado: github.csv";
                            badge.className = "text-xs bg-emerald-500/10 text-emerald-400 font-mono px-2 py-0.5 rounded border border-emerald-500/20";
                            processDataset(json);
                        })
                        .catch(() => {
                            badge.innerText = "Error al cargar archivo";
                            badge.className = "text-xs bg-rose-500/10 text-rose-400 font-mono px-2 py-0.5 rounded border border-rose-500/20";
                            document.getElementById('table-body').innerHTML = `
                                <tr>
                                    <td colspan="100%" class="p-8 text-center text-rose-400 font-sans">
                                        ❌ No se encontró 'github.xlsx' ni 'github.csv' en la raíz del repositorio.
                                    </td>
                                </tr>`;
                        });
                });
        }

        // 2. PROCESAR DATASET Y CREAR CABECERAS
        function processDataset(data) {
            rawData = data;
            filteredData = [...rawData];

            if (rawData.length === 0) return;

            // Extraer nombres de las columnas
            columns = Object.keys(rawData[0]);

            const headerTitleRow = document.getElementById('table-headers-title');
            const headerFilterRow = document.getElementById('table-headers-filter');

            headerTitleRow.innerHTML = '';
            headerFilterRow.innerHTML = '';

            columns.forEach((col, idx) => {
                columnFilters[col] = "";

                // 1. Título de Columna
                const thTitle = document.createElement('th');
                thTitle.className = "p-3 font-semibold text-gray-200 tracking-wider text-left min-w-[140px]";
                thTitle.innerText = col;
                headerTitleRow.appendChild(thTitle);

                // 2. Campo de Filtro por Columna
                const thFilter = document.createElement('th');
                thFilter.className = "p-2";
                thFilter.innerHTML = `
                    <input type="text" 
                        placeholder="Filtrar..." 
                        data-col="${col}"
                        oninput="onColumnFilterChange(this)"
                        class="w-full bg-[#0D1322] text-[11px] text-gray-300 placeholder-gray-600 px-2 py-1 rounded border border-gray-800 focus:outline-none focus:border-emerald-500 font-mono">
                `;
                headerFilterRow.appendChild(thFilter);
            });

            document.getElementById('total-count').innerText = rawData.length;
            renderTableBody();
        }

        // 3. CAPTURAR EVENTOS DE FILTRO POR COLUMNA
        function onColumnFilterChange(input) {
            const col = input.getAttribute('data-col');
            columnFilters[col] = input.value.toLowerCase().trim();
            applyFilters();
        }

        // 4. APLICAR FILTROS COMBINADOS (Global + Columnas)
        function applyFilters() {
            const globalQuery = document.getElementById('globalSearch').value.toLowerCase().trim();

            filteredData = rawData.filter(row => {
                // Filtro global
                if (globalQuery !== "") {
                    const matchGlobal = Object.values(row).some(val => 
                        String(val).toLowerCase().includes(globalQuery)
                    );
                    if (!matchGlobal) return false;
                }

                // Filtros individuales de cabecera
                for (let col of columns) {
                    const filterVal = columnFilters[col];
                    if (filterVal && filterVal !== "") {
                        const cellVal = String(row[col] || "").toLowerCase();
                        if (!cellVal.includes(filterVal)) {
                            return false;
                        }
                    }
                }

                return true;
            });

            renderTableBody();
        }

        // 5. RENDERIZAR CUERPO DE LA TABLA
        function renderTableBody() {
            const tbody = document.getElementById('table-body');
            document.getElementById('record-count').innerText = filteredData.length;

            if (filteredData.length === 0) {
                tbody.innerHTML = `
                    <tr>
                        <td colspan="${columns.length || 1}" class="p-8 text-center text-gray-500 font-sans">
                            No se encontraron registros que coincidan con los criterios de búsqueda.
                        </td>
                    </tr>`;
                return;
            }

            let html = '';
            filteredData.forEach((row, i) => {
                html += `<tr class="hover:bg-gray-800/30 transition-colors border-b border-gray-800/30 divide-x divide-gray-800/30">`;
                columns.forEach(col => {
                    const val = row[col];
                    const isNumeric = typeof val === 'number';
                    
                    // Formato visual ligero si detecta valores numéricos altos (ej. valores monetarios)
                    let formattedVal = val;
                    if (isNumeric && val > 1000) {
                        formattedVal = val.toLocaleString('es-CO');
                    }

                    html += `<td class="p-2.5 text-gray-300 font-sans text-xs whitespace-nowrap ${isNumeric ? 'text-right font-mono text-emerald-300/90' : ''}">${formattedVal}</td>`;
                });
                html += `</tr>`;
            });

            tbody.innerHTML = html;
        }

        // 6. LIMPIAR TODOS LOS FILTROS
        function clearAllFilters() {
            document.getElementById('globalSearch').value = '';
            
            // Limpiar objeto de filtros y campos HTML
            columns.forEach(col => {
                columnFilters[col] = "";
            });

            const inputs = document.querySelectorAll('#table-headers-filter input');
            inputs.forEach(input => input.value = '');

            applyFilters();
        }
    </script>
</body>
</html>
