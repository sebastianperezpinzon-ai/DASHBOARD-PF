<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Tablero de Compras</title>
  
  <script src="https://cdn.jsdelivr.net/npm/xlsx@0.18.5/dist/xlsx.full.min.js"></script>
  <script src="https://cdn.jsdelivr.net/npm/chart.js"></script>

  <style>
    body {
      font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
      margin: 20px;
      background-color: #f4f6f9;
      color: #333;
    }
    .header-bar {
      display: flex;
      justify-content: space-between;
      align-items: center;
      background: #ffffff;
      padding: 15px 25px;
      border-radius: 8px;
      box-shadow: 0 2px 8px rgba(0,0,0,0.08);
      margin-bottom: 20px;
    }
    .status-badge {
      font-size: 0.9em;
      padding: 6px 12px;
      border-radius: 20px;
      background-color: #e0e0e0;
      color: #555;
    }
    .status-active {
      background-color: #e8f5e9;
      color: #2e7d32;
    }
    .btn {
      padding: 8px 16px;
      border: none;
      border-radius: 6px;
      cursor: pointer;
      font-weight: 600;
      transition: background 0.2s;
    }
    .btn-primary { background: #0056b3; color: white; }
    .btn-primary:hover { background: #004085; }
    .btn-danger { background: #dc3545; color: white; }
    .btn-danger:hover { background: #bd2130; }
    #upload-container {
      background: white;
      padding: 20px;
      border-radius: 8px;
      margin-bottom: 20px;
      box-shadow: 0 2px 8px rgba(0,0,0,0.05);
    }
    .hidden { display: none !important; }
  </style>
</head>
<body>

  <div class="header-bar">
    <h2>Tablero de Control de Compras</h2>
    <div>
      <span id="data-status" class="status-badge">Sin datos cargados</span>
      <button id="btn-change-file" class="btn btn-primary hidden" onclick="toggleUploadUI()">Cambiar Archivo</button>
      <button id="btn-clear-data" class="btn btn-danger hidden" onclick="clearStoredData()">Borrar Datos Guardados</button>
    </div>
  </div>

  <div id="upload-container">
    <h3>Cargar Datos</h3>
    <p>Selecciona tu archivo de compras (Soporta formatos <strong>.xlsx, .xls y .csv</strong>):</p>
    <input type="file" id="fileInput" accept=".csv, .xlsx, .xls, application/vnd.openxmlformats-officedocument.spreadsheetml.sheet, application/vnd.ms-excel, text/csv">
  </div>

  <div id="dashboard" class="hidden">
    <h3>Resumen General</h3>
    <p>Total registros procesados: <strong id="total-records">0</strong></p>
    </div>

  <script>
    const STORAGE_KEY = 'cubo_compras_data';

    // Al cargar la página
    window.addEventListener('DOMContentLoaded', () => {
      // 1. Intentar cargar desde localStorage (Solución Falla 2)
      const storedData = localStorage.getItem(STORAGE_KEY);
      if (storedData) {
        try {
          const parsedData = JSON.parse(storedData);
          renderDashboard(parsedData, 'Guardado local (localStorage)');
          return;
        } catch (e) {
          console.error("Error al leer datos guardados:", e);
          localStorage.removeItem(STORAGE_KEY);
        }
      }

      // 2. Si no hay en localStorage, intentar leer automáticamente un archivo local si existe
      fetchAutoFile();
    });

    // Escuchar el evento de selección de archivo
    document.getElementById('fileInput').addEventListener('change', handleFileSelect);

    function handleFileSelect(event) {
      const file = event.target.files[0];
      if (!file) return;

      const reader = new FileReader();
      reader.onload = function(e) {
        try {
          const data = new Uint8Array(e.target.result);
          // SheetJS lee tanto Excel (.xlsx) como CSV automáticamente
          const workbook = XLSX.read(data, { type: 'array' });
          const firstSheetName = workbook.SheetNames[0];
          const worksheet = workbook.Sheets[firstSheetName];
          
          // Convertir a objeto JSON
          const jsonData = XLSX.utils.sheet_to_json(worksheet);

          if (jsonData.length > 0) {
            // Guardar en localStorage para que persista tras F5 / Recargar
            localStorage.setItem(STORAGE_KEY, JSON.stringify(jsonData));
            renderDashboard(jsonData, 'Archivo cargado correctamente');
          } else {
            alert('El archivo cargado no contiene datos válidos.');
          }
        } catch (err) {
          alert('Error al procesar el archivo. Asegúrate de que sea un archivo .xlsx o .csv válido.');
          console.error(err);
        }
      };
      reader.readAsArrayBuffer(file);
    }

    // Intenta buscar automáticamente el archivo 'github.csv' si está en el mismo servidor o carpeta
    function fetchAutoFile() {
      fetch('github.csv')
        .then(response => {
          if (!response.ok) throw new Error("No se encontró archivo automático.");
          return response.arrayBuffer();
        })
        .then(buffer => {
          const data = new Uint8Array(buffer);
          const workbook = XLSX.read(data, { type: 'array' });
          const jsonData = XLSX.utils.sheet_to_json(workbook.Sheets[workbook.SheetNames[0]]);
          if (jsonData.length > 0) {
            localStorage.setItem(STORAGE_KEY, JSON.stringify(jsonData));
            renderDashboard(jsonData, 'Cargado automáticamente desde el servidor');
          }
        })
        .catch(err => {
          // Si no se encuentra el archivo remoto/local, queda en espera de que el usuario lo suba manualmente
          console.log("Carga automática no disponible. En espera de archivo manual.");
        });
    }

    // Muestra los datos en el dashboard y gestiona la visibilidad de los controles
    function renderDashboard(data, statusMessage) {
      document.getElementById('upload-container').classList.add('hidden');
      document.getElementById('dashboard').classList.remove('hidden');
      document.getElementById('btn-change-file').classList.remove('hidden');
      document.getElementById('btn-clear-data').classList.remove('hidden');
      
      const badge = document.getElementById('data-status');
      badge.textContent = `Estado: ${statusMessage}`;
      badge.classList.add('status-active');

      document.getElementById('total-records').textContent = data.length;

      // TODO: Aquí invocas las funciones que construyen tus gráficos o tablas con el parámetro 'data'
      console.log("Datos listos para procesar:", data);
    }

    function toggleUploadUI() {
      document.getElementById('upload-container').classList.toggle('hidden');
    }

    function clearStoredData() {
      if (confirm('¿Deseas borrar los datos guardados en el navegador?')) {
        localStorage.removeItem(STORAGE_KEY);
        location.reload(); // Recarga la página para volver al estado inicial
      }
    }
  </script>
</body>
</html>
